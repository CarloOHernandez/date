<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Question</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8e1e1;
            text-align: center;
            overflow: hidden;
            padding: 20px;
        }

        .gif {
            width: 100%;
            max-width: 300px;
            transition: opacity 0.3s ease-in-out;
        }

        .container {
            margin-top: 20px;
            width: 100%;
            max-width: 400px;
        }

        #question {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #d63384;
            transition: opacity 0.3s ease-in-out;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            font-size: 1.2em;
            padding: 12px 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 20px;
            border: none;
            font-weight: bold;
        }

        button:hover {
            transform: scale(1.1);
        }

        #noButton {
            background-color: #ff6f61;
            color: white;
        }

        #yesButton {
            background-color: #ff4081;
            color: white;
        }

        /* Popup Styling */
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            padding: 20px;
            background: white;
            border: 3px solid #ff4081;
            border-radius: 15px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 0.3s ease-in-out;
        }

        .popup img {
            width: 100%;
            max-width: 250px;
        }

        .surprise {
            background-color: #ff4081;
            color: white;
            border-radius: 10px;
            padding: 10px 20px;
            margin-top: 15px;
            cursor: pointer;
            font-size: 1em;
        }

        /* Responsive Date Section */
        .date {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 420px;
            padding: 20px;
            background: #fff;
            border: 3px solid #ff4081;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 0.3s ease-in-out;
        }

        .date::before {
            content: "💖 Special Date Details 💖";
            font-size: 1.5em;
            font-weight: bold;
            color: #ff4081;
            display: block;
            margin-bottom: 15px;
        }

        .date p {
            font-size: 1.1em;
            font-weight: 600;
            color: #d63384;
            margin: 8px 0;
            background: rgba(255, 192, 203, 0.2);
            padding: 8px;
            border-radius: 8px;
        }

        .date button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #ff4081;
            color: white;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .date button:hover {
            background-color: #d63384;
            transform: scale(1.05);
        }

        /* Fade In Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -60%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

    </style>
</head>
<body>
    <p id="title" class="tanong">Will you be my Valentine? 💕</p>
    <img id="gif" class="gif" src="https://media2.giphy.com/media/2aw9gwZlltbdX92b4w/giphy.gif" alt="Cute GIF">
    
    <div class="container">
        <div id="question">🤔</div>
        <div class="buttons">
            <button id="noButton" onclick="enlargeYesButton()">No 😭</button>
            <button id="yesButton" onclick="showPopup()">Yes 😍</button>
        </div>
    </div>

    <div id="popup" class="popup">
        <img src="https://media3.giphy.com/media/FDbIUZLwbCUS4786z3/giphy.gif">
        <p class="hehe">I knew you loved me! 💖</p>
        <button class="surprise" onclick="showSurprise()">Click here for a surprise 🎁</button>
    </div>

    <div id="date" class="date">
        <p>📅 **CALL TIME:** February 14, 2025 - 6:30 PM </p>
        <p>🍽️ **WHAT:** Valentine's Date </p>
        <p>📍 **WHERE:** Loghouse Cafe</p>
        <p>👩‍❤️‍👨 **WHO:** Maria & Carlo </p>
        <p>💕 Let me know if you need any adjustments! 💖 </p>
    </div>

    <script>
        function enlargeYesButton() {
            const yesButton = document.getElementById('yesButton');
            const question = document.getElementById('question');
            const gif = document.getElementById('gif');
            const noButton = document.getElementById('noButton');

            let questionArray = [
                "Why no? ",
                "Are you really sure? ",
                "Just click YES...... ",
                "Are you absolutely sure? ",
                "Please! Please? "
            ];

            let gifArray = [
                "https://media2.giphy.com/media/xUOxfd9h4zALTO4G1W/giphy.gif",
                "https://media1.giphy.com/media/OPU6wzx8JrHna/giphy.gif",
                "https://media1.giphy.com/media/KkklFx4wVfw5Ey9FTe/giphy.gif",
                "https://media2.giphy.com/media/fHATu6Ryb8EtvZZgfZ/giphy.gif",
                "https://media1.giphy.com/media/P00UJ92KxwMmCPANJC/giphy.gif"
            ];

            let questionIndex = Math.floor(Math.random() * questionArray.length);
            question.innerText = questionArray[questionIndex];
            gif.src = gifArray[questionIndex];

            yesButton.style.transform = `scale(1.2)`;
        }

        function showPopup() {
            document.getElementById('popup').style.display = 'block';
        }

        function showSurprise() {
            document.getElementById('date').style.display = 'block';
        }
    </script>
</body>
</html>
